name: cms-ng

x-backend-image: &backend-image
  image: ${CMS_NG_BACKEND_IMAGE:-cms-ng-backend:local}
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
    args:
      NODE_VERSION: ${NODE_VERSION:-24.18.0}
      INSTALL_PLAYWRIGHT: ${INSTALL_PLAYWRIGHT:-false}

x-backend-env: &backend-env
  env_file:
    - ./backend/.env
  environment:
    NODE_ENV: production
    PORT: 3001
    TRUST_PROXY: "1"
    AUTHORS_DATA_DIR: /app/backend/data/authors
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  # A one-shot release task. It applies committed Prisma migrations and exits.
  # The backend is not allowed to start unless this service exits successfully.
  migrate:
    <<: [*backend-image, *backend-env]
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    networks: [app]

  backend:
    <<: [*backend-image, *backend-env]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
        restart: true
    expose: ["3001"]
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/users').then(r=>process.exit([200,401,403].includes(r.status)?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks: [app]

  frontend:
    image: ${CMS_NG_FRONTEND_IMAGE:-cms-ng-frontend:local}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-24.18.0}
        NEXT_PUBLIC_API_URL: ""
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose: ["3000"]
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-1g}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    networks: [app]

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${CMS_NG_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: ${PROXY_MEMORY_LIMIT:-128m}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/__proxy_health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
    networks: [app]

  # Optional: enable with COMPOSE_PROFILES=rss or `--profile rss`.
  rsshub:
    image: diygod/rsshub:chromium-bundled
    profiles: ["rss"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: 1800
    expose: ["1200"]
    mem_limit: ${RSSHUB_MEMORY_LIMIT:-1536m}
    networks: [app]

  # Optional: enable with COMPOSE_PROFILES=search and set
  # ELASTICSEARCH_ENABLED=true in backend/.env.
  elasticsearch:
    build: ./docker/elasticsearch
    profiles: ["search"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    expose: ["9200"]
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: ${ELASTICSEARCH_MEMORY_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?local=true || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  es-data:
