map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cms_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream cms_backend {
    server backend:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 210m;

    location = /__proxy_health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Keep the browser on one origin. Every NestJS controller prefix must be
    # listed here; all other routes belong to the Next.js App Router.
    location ~ ^/(auth|users|stories|articles|channels|auto-publish|trending-topics|ai|billing|media|notifications|authors|system-features|video|uploads)(/|$) {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://cms_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

