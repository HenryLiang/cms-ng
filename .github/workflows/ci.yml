name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一 PR/分支的新 push 自动取消进行中的旧 run,省资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint:
    name: Lint (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # lint 规则是类型化的(recommendedTypeChecked),需要 shared 的构建产物
      - run: npm run build --workspace=@cms-ng/shared
      # 生成 Prisma Client:@prisma/client 的类型(UserRole/ArticleWhereInput 等)由 schema 生成,npm ci 不会生成
      - run: cd backend && npx prisma generate
      - name: Backend lint
        run: cd backend && npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0
      - name: Frontend lint
        run: cd frontend && npx eslint . --max-warnings=0

  test-backend:
    name: Backend unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@cms-ng/shared
      - run: cd backend && npx prisma generate
      - run: cd backend && npm run test

  test-frontend:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@cms-ng/shared
      - run: cd frontend && npm run test

  build:
    name: Build (shared + backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cd backend && npx prisma generate
      - run: npm run build

  e2e:
    name: Backend E2E (real MySQL + Redis)
    runs-on: ubuntu-latest
    # e2e 是真实阻断关卡,不再 continue-on-error 掩盖 conclusion(消除绿灯幻觉)。
    # 套件为 Auth/Stories/Articles 纯 CRUD(无外部 AI 调用,确定性),红了就该红。
    # 是否 required(阻断合并)由分支保护单独控制,此处只保证 conclusion 诚实。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cms_ng_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # AppModule 启动时的 validateEnv() 必需项;密钥为 CI 占位值,仅要求存在
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/cms_ng_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-e2e-secret-at-least-16-chars
      AI_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ci-placeholder-key
      # CosStorageService 构造时 eager 校验 COS 密钥"存在"(仅校验存在,不联网),
      # e2e 纯 CRUD 不调用 COS,给占位值让 AppModule 能 boot(同 DEEPSEEK 占位模式)
      COS_SECRET_ID: ci-placeholder-cos-id
      COS_SECRET_KEY: ci-placeholder-cos-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@cms-ng/shared
      # migrate deploy 不生成 Client:e2e 要 import @prisma/client(PrismaService),
      # 必须先 prisma generate,否则 AppModule 编译/启动即失败——e2e 一直红的根因之一
      - name: Generate Prisma Client
        run: cd backend && npx prisma generate
      - name: Apply migrations
        run: cd backend && npx prisma migrate deploy
      - name: Run E2E
        run: cd backend && npm run test:e2e
